name: centari

# ── Shared configuration ──────────────────────────────────────────────────────

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ── Services ──────────────────────────────────────────────────────────────────

services:

  # ── Nginx reverse proxy ────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro          # mount SSL certs when ready
    depends_on:
      app:
        condition: service_healthy
    networks:
      - centari
    <<: [*restart, *logging]
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Next.js application ────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    env_file: .env
    environment:
      # These are consumed server-side only — never exposed to browser
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Public vars must be set at build time for Next.js static generation.
      # To update, rebuild the image: docker compose build app
      NEXT_PUBLIC_MAPTILER_KEY: ${NEXT_PUBLIC_MAPTILER_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - centari
    <<: [*restart, *logging]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── PostgreSQL (local worker state) ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - centari
    <<: [*restart, *logging]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Ollama inference server ────────────────────────────────────────────────
  # After first deploy, pull the model manually:
  #   docker compose exec ollama ollama pull qwen3:4b
  ollama:
    image: ollama/ollama:latest
    environment:
      # Bind to all interfaces within the Docker network (not exposed to host)
      OLLAMA_HOST: 0.0.0.0:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - centari
    <<: [*restart, *logging]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s

  # ── Research worker ────────────────────────────────────────────────────────
  # Runs continuously; schedules itself internally via WORKER_CRON.
  # Trigger a manual run: docker compose exec worker node dist/index.js --once
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      WORKER_CRON: ${WORKER_CRON:-0 */6 * * *}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    networks:
      - centari
    <<: [*restart, *logging]

# ── Networks ──────────────────────────────────────────────────────────────────

networks:
  centari:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
