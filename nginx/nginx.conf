# Centari — Nginx reverse proxy
# Alpha: HTTP only. SSL section is commented out; activate when certs are ready.

# Next.js upstream
upstream app {
    server app:3000;
    keepalive 32;
}

# ── HTTP server ───────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name _;          # accept any hostname in alpha

    # Security headers
    add_header X-Frame-Options           "SAMEORIGIN"            always;
    add_header X-Content-Type-Options    "nosniff"               always;
    add_header X-XSS-Protection          "1; mode=block"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # Proxy timeouts
    proxy_connect_timeout   10s;
    proxy_read_timeout      60s;
    proxy_send_timeout      60s;

    # Shared proxy headers
    proxy_http_version      1.1;
    proxy_set_header        Upgrade           $http_upgrade;
    proxy_set_header        Connection        "upgrade";
    proxy_set_header        Host              $host;
    proxy_set_header        X-Real-IP         $remote_addr;
    proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header        X-Forwarded-Proto $scheme;
    proxy_cache_bypass      $http_upgrade;

    # ── Next.js static assets — long cache, immutable ─────────────────────
    location /_next/static/ {
        proxy_pass http://app;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Next.js image optimisation ────────────────────────────────────────
    location /_next/image {
        proxy_pass http://app;
        add_header Cache-Control "public, max-age=86400";
    }

    # ── Favicon / robots / public static files ────────────────────────────
    location ~* ^/(favicon\.ico|robots\.txt|sitemap\.xml) {
        proxy_pass http://app;
        add_header Cache-Control "public, max-age=86400";
        access_log off;
    }

    # ── Everything else → Next.js ─────────────────────────────────────────
    location / {
        proxy_pass http://app;
    }
}

# ── HTTPS server (activate when SSL certs are available) ──────────────────────
# To enable:
#   1. Place cert.pem and key.pem in ./nginx/ssl/
#   2. Uncomment this block
#   3. Change the HTTP server block above to redirect: return 301 https://$host$request_uri;
#   4. docker compose exec nginx nginx -s reload
#
# server {
#     listen 443 ssl http2;
#     listen [::]:443 ssl http2;
#     server_name YOUR_DOMAIN;
#
#     ssl_certificate     /etc/nginx/ssl/cert.pem;
#     ssl_certificate_key /etc/nginx/ssl/key.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 10m;
#
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     # ... (repeat all proxy_pass and add_header directives from HTTP block above)
# }
